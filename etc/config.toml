# ── WHAT THE REAL BASE WILL AND WILL NOT DO ───────────────────────────────────────────────────
# The base component's OWN config, i.e. the same file the real robot runs. Supplies maxLinSpeed,
# maxRotSpeed, maxAcceleration, maxDeceleration, wheelRadius and axesLength; the bridge clips the
# twist as SVD48VBase/src/specificworker.py:161-173 does and ramps the wheels where SVD48V.py's
# driver ramp sits. Omnidirectional to match this file's (default) mecanum Base.Kinematics.
# ★Without it the simulated P3Bot drives 3.4x faster, turns 6.7x faster and accelerates in one
#  step where the real base needs 2.0 s to reach 0.7 m/s.
Base.ConfigFile = "/home/pbustos/robocomp/components/robocomp-robolab/components/hardware/base/SVD48VBase/etc/config_omnidirectional.toml"

[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"

# Proxies for publishes interfaces
FullPoseEstimationPubPrefix = ""


[Endpoints]
# Endpoints for subscriptions interfaces
JoystickAdapterTopic = "tcp -p 11025"
JoystickAdapterPrefix = ""

# Endpoints for implements interfaces
Camera360RGB = "tcp -p 10098"
CameraRGBDSimple = "tcp -p 10096"
DoorControl = "tcp -p 10008"
IMU = "tcp -p 10007"
Laser = "tcp -p 10003"
Lidar3D = "tcp -p 11988"
OmniRobot = "tcp -p 10004"
VisualElements = "tcp -p 10005"
Webots2Robocomp = "tcp -p 10006"


# The doors this bridge advertises over DoorControl, by the DEF of each hinge (the node with a
# `position` field). They are the ids callers see; a caller binds them to its own door identities by
# PLACE, so renaming a DEF here is safe and nothing outside may assume these are Webots names.
# Leave the list out entirely for a world whose doors are scenery: getCapabilities() then reports
# canActuate = false, which is what stops a caller offering an affordance it could never carry out.
[DoorControl]
Doors = ["DOOR_0", "DOOR_1"]




[Period]
Compute = 10
Emergency = 500

# Source of the VELOCITY fields published on FullPoseEstimationPub. The pose fields are supervisor
# ground truth either way, and OmniRobot is unaffected by this setting.
#   "wheels"     - wheel-encoder forward kinematics: the exact inverse of the mecanum IK in
#                  apply_pending_speed_command(), which is what SVD48VBase computes on the real
#                  robot (inv_m_wheels @ get_speed()). Includes real wheel slip.
#   "supervisor" - the historical robotNode->getVelocity() ground truth. Kept for A/B measurement.
#
# PublishPeriod is in ms. 100 = 10 Hz, matching the real base (SVD48VBase: Period.Compute = 100).
# The IMU stays at the step rate, and that rate GAP is what a consumer's high-rate injection
# propagates across. The published velocity is differenced over this whole interval, so it is the
# exact mean over it, not a sample of one step.
#
# NominalVelVar / NominalRotVar are per-sample variances in SI units squared, (m/s)^2 and (rad/s)^2.
# The simulator's own velocity noise is ~0 and a zero variance reads downstream as infinite
# confidence, so publish plausible real-robot figures and let the real base overwrite them once
# calibrated.
[FullPose]
VelocitySource = "wheels"
PublishPeriod = 20 
# ── Wheel noise, aligned with p3bot-bridge 2026-08-29 ──────────────────────────────────
# ★ SLIP COEFFICIENTS per unit speed since 2026-08-29, NOT flat densities. sigma(v) =
#   sqrt(Floor^2 + (WheelSigmaV * |v|)^2). An encoder at rest emits no counts, so it reports zero
#   with near-certainty; a flat density injects motion into a parked robot and the consumer
#   integrates it. Measured on P3Bot: parked drift 3.49 -> 0.122 mm/cycle.
# ⚠ The FLOORS are carried over from P3Bot and are NOT measured on Shadow. Shadow's encoders and
#   its differential base are not P3Bot's mecanum one. Re-measure with the robot demonstrably
#   parked (the zero-command residual) before trusting them; they are a starting point, not a
#   result. The same caution applies to reading WheelSigmaV/W as slip rather than as the flat
#   density they used to be.
WheelSigmaVFloor = 0.0005   # m/sqrt(s)
WheelSigmaWFloor = 0.0010   # rad/sqrt(s)

NominalVelVar = 1e-4
NominalRotVar = 1e-4

# Per-sample variances for the IMU, SI units squared: (rad/s)^2 and (m/s^2)^2. Nominal for the same
# reason as above -- the simulated gyro is exact and the accelerometer only quantises at 0.001.
[IMU]
NominalGyroVar = 1e-5
NominalAccVar = 1e-3

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
